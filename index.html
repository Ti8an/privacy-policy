<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hello World</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f13;
      --accent: #4f6ef7;
      --accent2: #7fdfb8;
      --text: #f0f0f0;
      --muted: #555b72;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79,110,247,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,110,247,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 70%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.4s;
    }

    .subtitle {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.7s;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent2);
      margin: 0 0.5rem;
      vertical-align: middle;
      animation: pulse 2s infinite;
    }

    .line {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      margin: 2rem auto 0;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1s, expandLine 0.8s ease forwards 1s;
      transform-origin: left;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    @keyframes expandLine {
      from { width: 0; }
      to   { width: 60px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="tag">// index.html</p>
    <h1>Hello<br>World</h1>
    <p class="subtitle">
      <span class="dot"></span>
      GitHub Pages is live
      <span class="dot"></span>
    </p>
    <div class="line"></div>
  </div>
</body>
</html>
